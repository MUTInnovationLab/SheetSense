<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Files Management</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    </head>
<body>
    <div class="navbar">
        <h1>Student Files Management</h1>
    </div>
    
    <div class="content">
        <div class="upload-section">
            <!-- Student List Upload -->
            <form id="studentFileForm" class="upload-form">
                <h3>Student List Upload</h3>

                <div class="file-input-container">
                    <label for="student_file">Choose Student List File (Excel):</label>
                    <input type="file" name="student_file" id="student_file" accept=".xlsx,.xls" required>
                    <div class="file-preview" id="student_file_preview"></div>
                </div>
                <button type="submit">Upload Student List</button>
            </form>

            <!-- Weekly Report Upload -->
            <form id="weeklyFileForm" class="upload-form">
                <h3>Weekly Report Upload</h3>
                <p class="file-requirements">Required fields: ID, Name, Lastname, Email, PDF File</p>
                <div class="file-input-container">
                    <label for="weekly_file">Choose Weekly Report (Excel):</label>
                    <input type="file" name="weekly_file" id="weekly_file" accept=".xlsx,.xls" required>
                    <div class="file-preview" id="weekly_file_preview"></div>
                </div>
                <button type="submit">Upload Weekly Report</button>
            </form>

            <!-- Monthly Report Upload -->
            <form id="monthlyFileForm" class="upload-form">
                <h3>Monthly Report Upload</h3>
                <p class="file-requirements">Required fields: ID, Name, Lastname, Email, PDF File</p>
                <div class="file-input-container">
                    <label for="monthly_file">Choose Monthly Report (Excel):</label>
                    <input type="file" name="monthly_file" id="monthly_file" accept=".xlsx,.xls" required>
                    <div class="file-preview" id="monthly_file_preview"></div>
                </div>
                <button type="submit">Upload Monthly Report</button>
            </form>
        </div>
    </div>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #333;
            padding: 15px;
            color: white;
            text-align: center;
        }

        .content {
            padding: 30px;
            background-color: white;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
        }

        h1, h2 {
            color: #333;
            font-size: 28px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-form {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .upload-form h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .upload-form label {
            display: block;
            margin-bottom: 8px;
            color: #666;
        }

        .file-input-container {
            position: relative;
            margin-bottom: 15px;
            width: 100%;
        }

        .file-preview {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none;
            background-color: #fff;
            position: relative;
        }

        .file-preview.active {
            display: block;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-right: 30px;
        }

        .file-icon {
            font-size: 24px;
            color: #666;
        }

        .clear-mark {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            font-weight: bold;
            color: #ff4444;
            font-size: 16px;
        }

        .clear-mark:hover {
            color: #cc0000;
        }

        .upload-form button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .upload-form button:hover {
            background-color: #45a049;
        }

        .upload-form button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #4CAF50;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyBvLwOd23fTx6RpAuodsyFZwntry6AV9Ik",
    authDomain: "cvsystem-253f9.firebaseapp.com",
    projectId: "cvsystem-253f9",
    storageBucket: "cvsystem-253f9.appspot.com",
    messagingSenderId: "133527156661",
    appId: "1:133527156661:web:8d8794eeae33b16dabcbfc"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// Process student data into the required format
function processStudentData(data) {
    return data.filter(row => {
        return row['Student number'] && 
               row['Full name/s'] && 
               row['Surname'] && 
               row['email address'];
    }).map(row => ({
        studentNumber: String(row['Student number'] || '').trim(),
        fullNames: String(row['Full name/s'] || '').trim(),
        surname: String(row['Surname'] || '').trim(),
        emailAddress: String(row['email address'] || '').toLowerCase().trim(),
        companyName: String(row['Company name'] || '').trim(),
        cellNumber: String(row['cellphone number'] || '').trim()
    }));
}

// Updated process report data with unified column mapping
function processReportData(data, reportType) {
    const columnMapping = {
        weekly: {
            timestamp: 'Timestamp',
            name: 'Name',
            lastname: 'Lastname',
            email: 'Email',
            companyName: 'Company name',
            fileUrl: 'Upload Weekly Report'
        },
        monthly: {
            timestamp: 'Timestamp',
            name: 'Name',
            lastname: 'Lastname',
            email: 'Email',
            companyName: 'Company Name',
            fileUrl: 'Upload Monthly Report'
        }
    };

    const columns = columnMapping[reportType];

    return data.filter(row => {
        return row[columns.timestamp] && 
               row[columns.name] && 
               row[columns.lastname] && 
               row[columns.email] &&
               row[columns.companyName] &&
               row[columns.fileUrl];
    }).map(row => ({
        timestamp: String(row[columns.timestamp] || '').trim(),
        name: String(row[columns.name] || '').trim(),
        lastname: String(row[columns.lastname] || '').trim(),
        email: String(row[columns.email] || '').toLowerCase().trim(),
        companyName: String(row[columns.companyName] || '').trim(),
        fileUrl: String(row[columns.fileUrl] || '').trim()
    }));
}

// Upload student file to Storage and get download URL
async function uploadFileToStorage(file, date) {
    const fileExtension = file.name.split('.').pop();
    const fileName = `student-lists/${date}_student_list.${fileExtension}`;
    const storageRef = ref(storage, fileName);
    
    const snapshot = await uploadBytes(storageRef, file);
    const downloadURL = await getDownloadURL(snapshot.ref);
    return downloadURL;
}

// Upload report file to Storage and get download URL
async function uploadReportToStorage(file, type, date) {
    const fileExtension = file.name.split('.').pop();
    const fileName = `${type}-reports/${date}_${type}_report.${fileExtension}`;
    const storageRef = ref(storage, fileName);
    
    const snapshot = await uploadBytes(storageRef, file);
    const downloadURL = await getDownloadURL(snapshot.ref);
    return downloadURL;
}

// Handle student file upload
async function handleFileUpload(event) {
    event.preventDefault();
    
    const form = event.target;
    const fileInput = form.querySelector('input[type="file"]');
    const submitButton = form.querySelector('button');
    
    if (!fileInput.files[0]) {
        alert('Please select a file first');
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'Uploading...';

    try {
        const file = fileInput.files[0];
        const currentDate = new Date().toISOString().split('T')[0];
        const fileURL = await uploadFileToStorage(file, currentDate);

        const reader = new FileReader();

        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                const students = processStudentData(jsonData);

                if (students.length === 0) {
                    throw new Error('No valid data found in the file');
                }

                const documentData = {
                    students: students,
                    uploadedAt: new Date().toISOString(),
                    uploadTimestamp: new Date(),
                    totalStudents: students.length,
                    fileURL: fileURL,
                    fileName: file.name
                };

                await setDoc(doc(db, 'students', currentDate), documentData);
                
                alert(`Successfully uploaded ${students.length} students and saved the file`);
                form.reset();
                
                if (typeof clearFilePreview === 'function') {
                    clearFilePreview(fileInput.id);
                }

            } catch (error) {
                alert(`Error processing file: ${error.message}`);
                console.error('Error:', error);
            }

            submitButton.disabled = false;
            submitButton.textContent = 'Upload Student File';
        };

        reader.onerror = (error) => {
            alert('Error reading file');
            console.error('FileReader error:', error);
            submitButton.disabled = false;
            submitButton.textContent = 'Upload Student File';
        };

        reader.readAsArrayBuffer(file);

    } catch (error) {
        alert(`Error uploading file: ${error.message}`);
        console.error('Upload error:', error);
        submitButton.disabled = false;
        submitButton.textContent = 'Upload Student File';
    }
}

// Updated Report Upload handler
async function handleReportUpload(event, reportType) {
    event.preventDefault();
    
    const form = event.target;
    const fileInput = form.querySelector('input[type="file"]');
    const submitButton = form.querySelector('button');
    
    if (!fileInput.files[0]) {
        alert('Please select a file first');
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'Uploading...';

    try {
        const file = fileInput.files[0];
        const currentDate = new Date().toISOString().split('T')[0];
        const fileURL = await uploadReportToStorage(file, reportType, currentDate);

        const reader = new FileReader();

        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                // Process the data using the unified column mapping
                const reports = processReportData(jsonData, reportType);

                if (reports.length === 0) {
                    throw new Error('No valid data found in the file');
                }

                const documentData = {
                    reports: reports,
                    date: currentDate,
                    uploadedAt: new Date().toISOString(),
                    uploadTimestamp: new Date(),
                    totalReports: reports.length,
                    fileURL: fileURL,
                    fileName: file.name
                };

                // Save to Firestore with the correct collection name
                await setDoc(doc(db, `${reportType}-reports`, currentDate), documentData);
                
                alert(`Successfully uploaded ${reports.length} ${reportType} reports`);
                form.reset();
                
                if (typeof clearFilePreview === 'function') {
                    clearFilePreview(fileInput.id);
                }

            } catch (error) {
                alert(`Error processing file: ${error.message}`);
                console.error('Error:', error);
            }

            submitButton.disabled = false;
            submitButton.textContent = `Upload ${reportType.charAt(0).toUpperCase() + reportType.slice(1)} Report`;
        };

        reader.onerror = (error) => {
            alert('Error reading file');
            console.error('FileReader error:', error);
            submitButton.disabled = false;
            submitButton.textContent = `Upload ${reportType.charAt(0).toUpperCase() + reportType.slice(1)} Report`;
        };

        reader.readAsArrayBuffer(file);

    } catch (error) {
        alert(`Error uploading file: ${error.message}`);
        console.error('Upload error:', error);
        submitButton.disabled = false;
        submitButton.textContent = `Upload ${reportType.charAt(0).toUpperCase() + reportType.slice(1)} Report`;
    }
}

// Function to update file preview
function updateFilePreview(input) {
    const previewId = input.id + '_preview';
    const previewDiv = document.getElementById(previewId);
    
    if (previewDiv) {
        if (input.files && input.files[0]) {
            const fileName = input.files[0].name;
            previewDiv.innerHTML = `
                <div class="file-info">
                    <i class="file-icon fas fa-file-excel"></i>
                    <span>${fileName}</span>
                    <span class="clear-mark" onclick="clearFilePreview('${input.id}')">&times;</span>
                </div>
            `;
            previewDiv.classList.add('active');
        } else {
            previewDiv.innerHTML = '';
            previewDiv.classList.remove('active');
        }
    }
}

// Function to clear file preview
window.clearFilePreview = function(inputId) {
    const input = document.getElementById(inputId);
    const previewDiv = document.getElementById(inputId + '_preview');
    
    if (input && previewDiv) {
        input.value = '';
        previewDiv.innerHTML = '';
        previewDiv.classList.remove('active');
    }
}

// Set up event listeners when the page loads
document.addEventListener('DOMContentLoaded', () => {
    // Student form handler
    const studentForm = document.getElementById('studentFileForm');
    if (studentForm) {
        studentForm.addEventListener('submit', handleFileUpload);
    }

    // Weekly report form handler
    const weeklyForm = document.getElementById('weeklyFileForm');
    if (weeklyForm) {
        weeklyForm.addEventListener('submit', (e) => handleReportUpload(e, 'weekly'));
    }

    // Monthly report form handler
    const monthlyForm = document.getElementById('monthlyFileForm');
    if (monthlyForm) {
        monthlyForm.addEventListener('submit', (e) => handleReportUpload(e, 'monthly'));
    }

    // Set up file previews for all file inputs
    const fileInputs = document.querySelectorAll('input[type="file"]');
    fileInputs.forEach(input => {
        input.addEventListener('change', () => updateFilePreview(input));
    });
})
    
</script>

</body>
</html>
